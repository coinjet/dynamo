<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D24"/>
      <stop offset="100%" stop-color="#0B0E11"/>
    </linearGradient>
    <linearGradient id="dynamoAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="terracottaAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#2A3441" stroke-width="2"/>

  <!-- Energy Pulse Outer Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#25303D" stroke-width="8" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#dynamoAmber)" stroke-width="8" stroke-dasharray="240 760" stroke-linecap="round" opacity="0.85"/>

  <!-- Center Glow -->
  <circle cx="256" cy="256" r="90" fill="#F59E0B" opacity="0.12" filter="url(#glow)"/>

  <!-- Dynamic Energy Bolt / Geometric 'D' + Energy Glyph -->
  <path d="M 284 120 L 196 264 L 252 264 L 228 392 L 316 248 L 260 248 Z" 
        fill="url(#dynamoAmber)" 
        stroke="#FEF3C7" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Orbiting dots symbolizing connected nodes/pulses -->
  <circle cx="370" cy="190" r="10" fill="url(#terracottaAccent)" />
  <circle cx="142" cy="322" r="8" fill="#FBBF24" opacity="0.9" />
</svg>
